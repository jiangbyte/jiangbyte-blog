  #   url: https://x.com/your-handle
  #   icon: ri:twitter-fill
  #   color: '#4b9ae4'
  # bilibili:
  #   url: https://space.bilibili.com/your-id
  #   icon: ri:bilibili-fill
  #   color: '#da708a'
  # zhihu:
  #   url: https://www.zhihu.com/people/your-id
  #   icon: ri:zhihu-fill
  #   color: '#1e88e5'
  # music:
  #   url: https://music.163.com/#/user/home?id=your-id
  #   icon: ri:netease-cloud-music-line
  #   color: '#e60026'

# =============================================================================
# Friends Links
# 友情链接页面配置 - 展示友链列表和申请说明
# =============================================================================
# intro: 页面介绍文字配置
#   title: 页面标题
#   subtitle: 页面副标题
#   applyTitle: 申请区块标题
#   applyDesc: 申请说明文字
#   exampleYaml: 申请格式示例（YAML 格式）
# data: 友链列表数组
#   - site: 站点名称
#   - url: 站点地址
#   - owner: 站长昵称
#   - desc: 站点描述/简介
#   - image: 头像图片 URL
#   - color: (可选) 主题色，十六进制格式；显示在头像外圈和悬停效果上
#   - group: (可选) 所属分组的 id；未填写或找不到分组时归入「未分组」
# groups: (可选) 友链分组，按配置顺序展示；不配置则为平铺列表
#   - id: 分组标识，供友链的 group 引用（唯一）
#   - title: 分组标题
#   - description: (可选) 分组说明
# -----------------------------------------------------------------------------
friends:
  groups:
    - id: familiar
      title: 熟人
      description: 常有交流、彼此熟悉的朋友。
    - id: community
      title: 友链小伙伴
      description: 通过博客结识、交换友链的小伙伴。
    - id: following
      title: 单向关注
      description: 喜欢阅读、推荐给大家的博客。
  intro:
    title: 友情链接 # 页面标题
    subtitle: 欢迎交换友链！ # 页面副标题
    applyTitle: 申请友链 # 申请区块标题
    applyDesc: 请在本页留言，格式如下 # 申请说明
    exampleYaml: | # 申请格式示例，会显示在页面上
      - site: 你的博客名称 # 站点名称
        url: https://your-blog.com/ # 站点网址
        owner: 你的昵称 # 昵称
        desc: 站点简介 # 站点简介
        image: https://your-blog.com/avatar.jpg # 头像链接
        color: "#ffc0cb" # 主题色（可选）
  data: []

# =============================================================================
# Announcements
# 公告系统 - 在页面顶部显示重要通知
# =============================================================================
# 字段说明：
#   id: 唯一标识符，用于记录用户已读状态（localStorage）
#   title: 公告标题
#   content: 公告内容文字
#   type: 类型，影响样式颜色 (info/success/warning/error)
#   priority: 优先级数字，数值越大排序越靠前
#   color: (可选) 自定义颜色，覆盖 type 默认色
#   publishDate: 发布日期，格式 'YYYY-MM-DD'
#   startDate: (可选) 开始显示时间，ISO 8601 格式
#   endDate: (可选) 结束显示时间，过期后自动隐藏
#   link: (可选) 相关链接
#     url: 链接地址
#     text: 链接文字
#     external: 是否在新窗口打开 (true/false)
# -----------------------------------------------------------------------------
# 取消下方注释即可启用公告示例：
# -----------------------------------------------------------------------------
