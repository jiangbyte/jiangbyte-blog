# yaml-language-server: $schema=https://json-schema.org/draft-07/schema
# =============================================================================
# Site Configuration
# =============================================================================
# This file contains all site-specific configurations.
# Modify this file to customize your blog.
# After changes, restart the dev server or rebuild the site.
# =============================================================================

# =============================================================================
# Site Basic Information
# =============================================================================
site:
  title: 摸鱼猫泡泡
  # alternate = 首页封面第二行 / SEO 副名；页头 Logo 用 title
  alternate: Charlie's Blog
  subtitle: 记录工具与工程实践
  name: Charlie
  description: 全栈 / 嵌入式 / ACG / INFJ
  avatar: /img/avatar.webp
  showLogo: false
  author: Charlie
  url: https://jiangbyte.cn/
  defaultOgImage: /img/avatar.webp
  startYear: 2026
  timezone: Asia/Shanghai
  # 无 link 时，用文件名 slug 转拼音/英文作为文章 URL
  enableSlugTransliteration: true
  keywords:
    - 摸鱼猫泡泡
    - Charlie
    - Charlie's Blog
    - 工具
    - 工程实践
    - 嵌入式
  icp:
    text: "黔ICP备2026018565号-1"
    link: "https://beian.miit.gov.cn/"
  police:
    text: "贵公网安备52260102556648号"
    link: "https://beian.mps.gov.cn/#/query/webSearch?code=52260102556648"
    icon: "/img/beian.png"

# =============================================================================
# Internationalization (i18n)
# =============================================================================
i18n:
  defaultLocale: zh
  locales:
    - code: zh
      label: 中文

# =============================================================================
# Category Map
# =============================================================================
categoryMap:
  工具: tools
  运维: ops
  实践: practice
  嵌入式: embedded
  LeetCode: leetcode
  项目: project
  源码阅读: source-reading
  数据库: database
  软考: soft-exam
  职场: career
  Claire: claire
  笔记: note
  Java: java
  MySQL: mysql
  Redis: redis
  高级架构师: advanced-architect

# =============================================================================
# Featured Categories (Homepage)
# =============================================================================
featuredCategories:
  - link: tools
    label: 工具
    image: /img/cover/11.webp
    description: Git、Agent、环境与编辑器
  - link: ops
    label: 运维
    image: /img/cover/8.webp
    description: Debian、Docker、Nginx 与部署
  - link: project
    label: 项目集
    image: /img/cover/1.webp
    description: 开源与个人项目介绍
  - link: soft-exam
    label: 软考
    image: /img/cover/10.webp
    description: 高级架构师笔记

# =============================================================================
# Featured Series
# =============================================================================
featuredSeries:
  - slug: projects
    categoryName: 项目
    label: 项目集
    fullName: 项目集
    description: |
      开源与个人项目介绍：定位、能力与技术栈。
    cover: /img/cover/1.webp
    enabled: true
    icon: ri:apps-2-line
    highlightOnHome: false
  - slug: soft-exam
    categoryName: 软考
    label: 软考
    fullName: 软考 · 高级架构师
    description: |
      系统架构设计师相关笔记与章节整理。
    cover: /img/cover/10.webp
    enabled: true
    icon: ri:book-read-line
    highlightOnHome: false
  - slug: source-reading
    categoryName: 源码阅读
    label: 源码
    fullName: 源码阅读
    description: |
      JDK 等源码阅读笔记。
    cover: /img/cover/12.webp
    enabled: true
    icon: ri:code-s-slash-line
    highlightOnHome: false

# =============================================================================
# Social Links
# 社交链接 - 显示在页脚和个人信息区域
# =============================================================================
# 字段说明：
#   url: 链接地址（邮箱需加 mailto: 前缀）
#   icon: Iconify 图标标识，格式为 "集合:图标名"
#         图标查询：https://icon-sets.iconify.design/ri/
#   color: (可选) 图标颜色，十六进制格式如 '#191717'
# -----------------------------------------------------------------------------
# 添加新平台：复制现有配置块，修改键名和各字段值即可
# -----------------------------------------------------------------------------
social:
  github:
    url: https://github.com/jiangbyte
    icon: ri:github-fill
    color: '#191717'
  rss:
    url: /rss.xml
    icon: ri:rss-line
    color: '#ff6600'
  # -------------------------------------------------------------------------
  # 以下是更多可选的社交平台配置示例，取消注释并修改即可启用：
  # -------------------------------------------------------------------------
